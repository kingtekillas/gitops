image:
  flavor: apache

nextcloud:
  host: nextcloud.local
  username: admin
  password: change-me-now
  email: admin@example.local
  extraEnv:
    - name: OVERWRITEHOST
      value: nextcloud.local
    - name: OVERWRITECLIURL
      value: https://nextcloud.local
    - name: TRUSTED_PROXIES
      value: 10.42.0.0/16 10.43.0.0/16

phpClientHttpsFix:
  enabled: true
  protocol: https

ingress:
  enabled: true
  className: traefik
  path: /
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: local-selfsigned
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: https
  tls:
    - secretName: nextcloud-tls
      hosts:
        - nextcloud.local

persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 20Gi

startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 90
  successThreshold: 1

livenessProbe:
  enabled: true
  initialDelaySeconds: 600
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 40
  successThreshold: 1

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: mysql
  host: nextcloud-mariadb
  database: nextcloud
  user: nextcloud
  password: change-db-password

mariadb:
  enabled: true
  architecture: standalone
  auth:
    database: nextcloud
    username: nextcloud
    password: change-db-password
    rootPassword: change-root-password
  primary:
    persistence:
      enabled: true
      storageClass: local-path
      size: 8Gi
    livenessProbe:
      enabled: true
      initialDelaySeconds: 120
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 10
    readinessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 10
  image:
    registry: docker.io
    repository: bitnamilegacy/mariadb
    tag: 11.3.2-debian-12-r1

redis:
  enabled: true
  architecture: standalone
  auth:
    password: change-redis-password
  # image:
  #   registry: docker.io
  #   repository: bitnamilegacy/redis
  #   tag: 7.2.4-debian-12-r9
  master:
    persistence:
      enabled: true
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 10
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 10
  replica:
    replicaCount: 0
    persistence:
      enabled: false
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 10
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 10
